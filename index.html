<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money" />
    <title>Money</title>
    <style>
      /* Critical CSS to prevent theme flash - using OKLCH to match index.css */
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
      }

      .dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
      }

      html {
        background-color: var(--background);
        color: var(--foreground);
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #root {
        min-height: 100dvh;
        background-color: var(--background);
      }
    </style>
    <script>
      // This file IS the precached app shell, so this script is the only recovery
      // path that still runs when the cached bundle is broken: /?sw-reset=1
      if (location.search.indexOf('sw-reset') !== -1 && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) })
          .then(function () { return caches.keys() })
          .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) })
          .catch(function () {})
          .then(function () { location.replace('/') })
      }

      // Prevent flash of wrong theme by setting theme before page renders
      (function() {
        const storageKey = 'finance-tracker-theme'
        const storedTheme = localStorage.getItem(storageKey)
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'

        let theme = 'light'
        if (storedTheme === 'dark' || storedTheme === 'light') {
          theme = storedTheme
        } else if (storedTheme === 'system' || !storedTheme) {
          theme = systemTheme
        }

        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
