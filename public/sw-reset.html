<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Money — Reset offline cache</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        color: #fafafa;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p {
        max-width: 28rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <p id="status">Clearing the offline cache…</p>
    <script>
      (function () {
        function done(message) {
          document.getElementById('status').textContent = message
        }

        function clearCaches() {
          if (typeof caches === 'undefined') return Promise.resolve()
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (key) {
                return caches.delete(key)
              })
            )
          })
        }

        function unregisterAll() {
          if (!('serviceWorker' in navigator)) return Promise.resolve()
          return navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(
              registrations.map(function (registration) {
                return registration.unregister()
              })
            )
          })
        }

        unregisterAll()
          .then(clearCaches)
          .then(function () {
            done('Offline cache cleared. Redirecting…')
            setTimeout(function () {
              location.replace('/')
            }, 800)
          })
          .catch(function () {
            done('Could not clear the offline cache automatically. Clear this site’s data in your browser settings.')
          })
      })()
    </script>
  </body>
</html>
